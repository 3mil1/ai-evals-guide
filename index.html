<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19332d">
  <meta name="description" content="Public videos, articles, and exercises covering the AI Evals course topics.">
  <title>AI Evals Study Guide</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="course-data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#course-content">Skip to course materials</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#start" class="brand" aria-label="AI Evals home">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>AI Evals</span>
      </a>
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Search the course</span>
        <input id="course-search" type="search" placeholder="Search the course" autocomplete="off" aria-controls="course-content">
      </label>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="Course navigation">
      <h2>Syllabus</h2>
      <nav id="course-navigation" aria-label="Course sections"></nav>
      <div class="progress-box" id="progress-box" hidden>
        <div class="progress-heading"><span>Watched</span><span id="progress-count"></span></div>
        <progress id="course-progress" value="0" max="1" aria-label="Videos watched"></progress>
      </div>
    </aside>

    <main>
      <header class="course-header">
        <p class="course-subtitle" id="course-subtitle">Hamel Husain and Shreya Shankar</p>
        <h1 id="course-title">AI Evals For Engineers &amp; PMs</h1>
        <p class="course-meta" id="course-meta"></p>
      </header>
      <div id="course-content" tabindex="-1">
        <noscript>Enable JavaScript to browse the syllabus and watch videos.</noscript>
      </div>
    </main>
  </div>
</body>
</html>
