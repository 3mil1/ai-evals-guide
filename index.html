<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19332d">
  <meta name="description" content="Открытые видео, статьи и практика по темам курса AI Evals Hamel Husain и Shreya Shankar.">
  <title>AI Evals — открытые материалы</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="course-data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#course-content">К материалам</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#start" class="brand" aria-label="AI Evals — к началу курса">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>AI Evals</span>
      </a>
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Поиск по курсу</span>
        <input id="course-search" type="search" placeholder="Поиск по курсу" autocomplete="off" aria-controls="course-content">
      </label>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="Навигация по курсу">
      <h2>Программа</h2>
      <nav id="course-navigation" aria-label="Разделы курса"></nav>
      <div class="progress-box" id="progress-box" hidden>
        <div class="progress-heading"><span>Просмотрено</span><span id="progress-count"></span></div>
        <progress id="course-progress" value="0" max="1" aria-label="Просмотренные видео"></progress>
      </div>
    </aside>

    <main>
      <header class="course-header">
        <p class="course-subtitle" id="course-subtitle">Hamel Husain и Shreya Shankar</p>
        <h1 id="course-title">AI Evals For Engineers &amp; PMs</h1>
        <p class="course-meta" id="course-meta"></p>
      </header>
      <div id="course-content" tabindex="-1">
        <noscript>Для навигации по программе и просмотра видео нужен JavaScript.</noscript>
      </div>
    </main>
  </div>
</body>
</html>
